# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/66261547b75885786777a0b9c8a4400ab81d432e/kas/schema-kas.json
header:
  version: 14
  includes:
    - ../config/common.yaml
    - ../config/starfive-vision2.yaml
    - ../config/network.yaml
    - ../config/monitor.yaml
    - ../config/package-management.yaml
    - ../config/tedge-docker.yaml
    - ../config/tedge-nodered.yaml

machine: starfive-visionfive2
distro: poky
target: core-image-tedge-mender

env:
  IMAGE_VERSION_SUFFIX: "_123123"
  MENDER_ARTIFACT_NAME: "core-image-tedge-mender-${MACHINE}${IMAGE_VERSION_SUFFIX}"

defaults:
  repos:
    branch: kirkstone

repos:
  poky:
    url: "https://git.yoctoproject.org/git/poky"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-starfive:
    url: "https://github.com/starfive-tech/meta-starfive"
    branch: starfive-kirkstone

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-filesystems:
      meta-gnome:
      meta-xfce:
      meta-webserver:

  meta-mender:
    url: "https://github.com/mendersoftware/meta-mender"
    layers:
      meta-mender-core:

  meta-clang:
    url: https://github.com/kraj/meta-clang

  meta-lts-mixins-rust:
    url: "https://git.yoctoproject.org/meta-lts-mixins"
    branch: kirkstone/rust

  meta-tedge:
    path: ../../
    layers:
      meta-tedge:
      meta-tedge-common:
      meta-tedge-extras:

  meta-lts-mixins-go:
    url: "https://github.com/moto-timo/meta-lts-mixins.git"
    branch: kirkstone/go

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
